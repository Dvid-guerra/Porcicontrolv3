      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="pig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
